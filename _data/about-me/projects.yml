data:
  - title:
      ko: "AI Agent-based Augmented Reading eXperience (AReX)"
    status:
      ko: "대회 참가작"
      color: info
    images:
      - url: "/images/projects/arex-1.png"
        orientation: landscape
      - url: "/images/projects/arex-2.png"
        orientation: landscape
      - url: "/images/projects/arex-3.png"
        orientation: landscape
      - url: "/images/projects/arex-4.png"
        orientation: landscape
      - url: "/images/projects/arex-5.svg"
        orientation: portrait
      - url: "/images/projects/arex-6.svg"
        orientation: landscape
      - url: "/images/projects/arex-7.svg"
        orientation: portrait
    team:
      name:
        ko: "The Geppettos"
      size: 2
    period:
      period_str: "2025.07 ~ 2025.10"
      type: development
    specs:
      - langchain
      - langgraph
      - chroma
      - typescript
      - react
      - express
      - python
      - docker
      - rabbitmq
      - postgresql
    resume_description:
      - type: list
        inner:
          - ko: "AI Agent 및 RAG 기반의 소설 특화 대화형 전자책 서비스 (대회 출품작)"
    description:
      - type: link_buttons
        inner:
          - label:
              ko: "소스코드"
            url: "https://github.com/The-Geppettos/AReX"
          - label:
              ko: "소개 영상"
            url: "https://youtu.be/uCMB6xpeiUM"

      - type: paragraph
        inner:
          ko: "AReX는 Agent AI-based Augmented Reading eXperience의 약자로, 소설책에 특화된 Agent 기반 전자책 서비스입니다. 대학 동기와 함께 개발하였으며, 오픈소스 개발자대회와사이드임팩트 출품작입니다. 독서량 감소 문제를 해결하고 소설책을 더 즐겁게 읽을 수 있는 방법을 고민하며 착안한 아이디어로, 소설 속 등장인물을 모방하는 대화형 챗봇 기능을 제공합니다. Agent 기반 아키텍처를 도입하여 필요에 따라 다양한 Tool(RAG 기반 문맥 검색 등)을 동적으로 호출하도록 구현했습니다."

      - type: list
        inner:
          - ko: "<b>AI Agent 기반 챗봇 설계 및 Tool Call 구조</b>"
          - sublist: true
            inner:
              - ko: "Tool 정의 및 동적 호출: 답변 생성에 필요한 정보를 불러오기 위해 정의된 Tool을 상황에 맞게 선택하여 실행"
          - ko: "<b>챗봇 모드</b>"
          - sublist: true
            inner:
              - ko: "도우미 모드: 독서 중 궁금한 점을 질문하고 답변 제공"
              - ko: "등장인물 모드: 등장인물의 말투, 지식, 상황을 재현하여 대화"
          - ko: "<b>RAG (Retrieval-Augmented Generation) 기반 시점 맞춤형 문맥 제공</b>"
          - sublist: true
            inner:
              - ko: "독자가 현재까지 읽은 범위 이후의 내용은 Agent의 접근을 물리적으로 제한하여 \"AI가 책을 대신 읽어주지 않는다\"는 원칙을 지키도록 설계"
              - ko: "등장인물 모드에서 독자의 현재 독서 시점을 대화의 ‘현재’로 정의하여, 진척도에 따른 등장인물의 성장과 변화가 반영되도록 설계"
          - ko: "<b>책 원문 전처리 파이프라인 아키텍처 설계</b>"

      - type: paragraph
        inner:
          ko: "대회 기간 내에 구현하지는 못했지만, AI 기반으로 독자의 행동 패턴을 분석하여 올바른 독서 습관을 형성할 수 있도록 돕는 피드백 기능을 구상하기도 했습니다. 기회가 된다면 이러한 아이디어를 더 발전시켜 나가고 싶습니다."

  - title:
      ko: "실시간 신체 분할 기반 인물 재식별(Re-ID) 모델"
    status:
      ko: "오픈소스"
      color: success
    images:
      - url: "/images/22/model-architecture.jpg"
        orientation: landscape
      - url: "/images/22/comparison-diagram.jpg"
        orientation: landscape
    team:
      size: 1
    period:
      period_str: "2024.07 ~ 2026.05"
      type: development
    specs:
      - python
      - pytorch
      - onnx
      - react
      - typescript
    resume_description:
      - type: list
        inner:
          - ko: "실제 카메라 환경을 고려해 속도, 정확도, 커버리지, 일반화 성능를 최적화한 실시간 인물 재식별(Re-ID) 모델 및 온디바이스 웹 데모"
    description:
      - type: link_buttons
        inner:
          - label:
              ko: "소스코드"
            url: "https://github.com/juhonamnam/realtime-re-id"
          - label:
              ko: "데모 페이지"
            url: "https://juhonamnam.github.io/realtime-re-id/"
          - label:
              ko: "개발기"
            url: "https://juhonamnam.github.io/blog/post/22"

      - type: paragraph
        inner:
          ko: "실제 카메라 환경을 고려해 설계한 신체 분할 기반 인물 재식별(Re-ID) 시스템입니다. BPBReID(Body-Part-Based Re-ID) 모델을 기반으로 하되, 논문의 모델 구조를 단순 재현(Reproduction)하는 것에 그치지 않고, 실제 실시간 서비스 목적에 맞춰 아키텍처와 파이프라인을 수정 및 변형하여 구현했습니다. 속도와 정확도 사이의 트레이드오프를 고려한 백본을 설계하고, 단일 데이터셋의 정확도가 아닌 일반화 성능을 우선시하여 실제 서비스 환경에 더 적합한 학습 방법을 구상했으며, 가림 및 잘림 현상에서도 견고하게 동작하는 Quality Filtering의 커버리지를 고려한 파이프라인을 설계했습니다. 최종적으로는 웹 브라우저에서 100% 온디바이스로 구동하는 YOLO + Re-ID 라이브 데모 웹 서비스를 구축했습니다."

      - type: list
        inner:
          - ko: "<b>경량 백본 네트워크 설계</b>"
          - sublist: true
            inner:
              - ko: "기존 HRNet 백본 대비 경량 모델인 ResNet, MobileNet 등에 FPN을 결합한 구조 설계"
              - ko: "2배에서 4배까지의 속도 향상과 이에 따른 정확도 손실 트레이드오프를 고려한 백본 설계"
          - ko: "<b>Quality Filtering의 커버리지를 고려한 설계</b>"
          - sublist: true
            inner:
              - ko: "엄격한 필터링: 높은 정확도와 낮은 커버리지"
              - ko: "느슨한 필터링: 낮은 정확도와 높은 커버리지"
          - ko: "<b>Multi-task Learning 및 데이터셋 통합을 통한 일반화 성능 개선</b>"
          - sublist: true
            inner:
              - ko: "COCO DensePose 및 다종 Re-ID 데이터셋(Market1501, DukeMTMC, AI Hub 등) 동시 학습"
              - ko: "단일 데이터셋의 성능보다 일반화 성능을 우선시하여 실제 서비스 환경에서의 적합성 향상"
          - ko: "<b>onnxruntime-web 기반 100% 온디바이스 웹 데모 페이지 개발</b>"

      - type: paragraph
        inner:
          ko: "프로젝트 진행 과정에서 위에 기술된 내용 외에도 최종적으로 채택되지 않은 다양한 아이디어들이 존재했으며, 각 아이디어가 기대만큼의 성능 향상으로 이어지는지 확인하는 데 상당한 시간과 시행착오를 거쳤습니다. 여러 가능성을 직접 실험하고 비교해보며 가장 적합한 방향을 찾아가는 과정에 많은 노력을 기울였습니다."

  - title:
