data:
  - title:
      ko: "AI Agent-based Augmented Reading eXperience (AReX)"
    status:
      ko: "대회 참가작"
      color: info
    images:
      - url: "/images/projects/arex-1.png"
        orientation: landscape
      - url: "/images/projects/arex-2.png"
        orientation: landscape
      - url: "/images/projects/arex-3.png"
        orientation: landscape
      - url: "/images/projects/arex-4.png"
        orientation: landscape
      - url: "/images/projects/arex-5.svg"
        orientation: portrait
      - url: "/images/projects/arex-6.svg"
        orientation: landscape
      - url: "/images/projects/arex-7.svg"
        orientation: portrait
    team:
      name:
        ko: "The Geppettos"
      size: 2
    period:
      period_str: "2025.07 ~ 2025.10"
      type: development
    specs:
      - typescript
      - express
      - docker
      - rabbitmq
      - postgresql
      - react
      - python
      - langchain
      - langgraph
      - chroma
    resume_description:
      - type: list
        inner:
          - ko: "AI Agent 및 RAG 기반의 소설 특화 대화형 전자책 서비스 (대회 출품작)"
    links:
      - label:
          ko: "소스코드"
        url: "https://github.com/The-Geppettos/AReX"
      - label:
          ko: "소개 영상"
        url: "https://youtu.be/uCMB6xpeiUM"

    description:
      - type: paragraph
        inner:
          ko: "AReX는 Agent AI-based Augmented Reading eXperience의 약자로, 소설책에 특화된 Agent 기반 전자책 서비스입니다. LLM 기반 Agent를 활용하여 등장인물의 말투, 지식, 상황을 재현하는 챗봇을 구현했습니다."

      - type: list
        inner:
          - ko: "RabbitMQ 기반 Text 전처리 파이프라인 설계 및 구현"
          - ko: "전자책 콘텐츠를 위한 UI 및 RESTful API 설계 및 구현"
          - ko: "Monorepo/MSA 구조로 Docker 기반 배포 환경 구축"
          - ko: "VectorDB 기반의 RAG와 Tool Calling을 활용한 등장인물 모드 챗봇 구현"
          - ko: "AWS 기반 MVP 서비스 배포 및 운영 (현재는 중단)"

  - title:
      ko: "실시간 Re-Identification 모델"
    status:
      ko: "오픈소스"
      color: success
    images:
      - url: "/images/22/model-architecture.jpg"
        orientation: landscape
      - url: "/images/22/comparison-diagram.jpg"
        orientation: landscape
    team:
      size: 1
    period:
      period_str: "2024.07 ~ 2026.05"
      type: development
    specs:
      - python
      - pytorch
      - onnx
      - react
      - typescript
    resume_description:
      - type: list
        inner:
          - ko: "실제 카메라 환경을 고려한 Re-Identification AI 모델 및 온디바이스 웹 데모"
    links:
      - label:
          ko: "소스코드"
        url: "https://github.com/juhonamnam/realtime-re-id"
      - label:
          ko: "데모 페이지"
        url: "https://juhonamnam.github.io/realtime-re-id/"
      - label:
          ko: "개발기"
        url: "https://juhonamnam.github.io/blog/post/22"

    description:
      - type: paragraph
        inner:
          ko: "실제 카메라 환경에서 동일인 식별을 위한 Re-Identification 모델을 연구 개발했습니다."

      - type: list
        inner:
          - ko: "BPBReID(Body-Part-Based Re-ID) 논문의 모델을 커스터마이징하여 직접 설계 및 학습"
          - ko: "onnxruntime-web 기반 YOLO + Re-ID 라이브 데모 웹 서비스를 구축"

  - title:
      ko: "모바일 청첩장"
    images:
      - url: "/images/projects/wedding-invitation-1.png"
        orientation: portrait
      - url: "/images/projects/wedding-invitation-2.png"
        orientation: portrait
      - url: "/images/projects/wedding-invitation-3.png"
        orientation: portrait
      - url: "/images/projects/wedding-invitation-4.png"
        orientation: portrait
      - url: "/images/projects/wedding-invitation-5.png"
        orientation: portrait
      - url: "/images/projects/wedding-invitation-6.png"
        orientation: portrait
    team:
      size: 1
    period:
      period_str: "2024.03 ~ 2024.09"
      type: development
    status:
      ko: "오픈소스"
      color: success
    specs:
      - react
      - go
      - typescript
      - sass
      - nginx
      - sqlite
    resume_description:
      - type: list
        inner:
          - ko: "실제 결혼식을 위해 제작한 React 기반 모바일 청첩장 템플릿 (GitHub 100+ fork 기록)"
    links:
      - label:
          ko: "소스코드"
        url: "https://github.com/juhonamnam/wedding-invitation"
      - label:
          ko: "청첩장 샘플"
        url: "https://juhonamnam.github.io/wedding-invitation"
      - label:
          ko: "개발기"
        url: "https://juhonamnam.github.io/blog/post/18"

    description:
      - type: paragraph
        inner:
          ko: "실제 저의 결혼식을 위해 직접 제작한 React 기반 모바일 청첩장입니다. 단순한 개인 용도에서 출발했지만 다른 사용자들의 문의가 들어오면서 오픈소스 템플릿으로 전환했습니다. 현재는 네이버 및 카카오 API 업데이트 시  이에 대응하는 정도로만 유지하고 있습니다."

      - type: list
        inner:
          - ko: "도메인 연동과 SSL 인증서로 Naver Cloud Platform 배포"
          - ko: "방명록 상태 저장 및 조회를 위한 Golang/SQLite 기반 간단한 백엔드 구현"
          - ko: "Naver Map API, Kakao SDK 등 외부 API 연동"
          - ko: "2026년 6월 기준 GitHub 100+ fork 기록"

  - title:
      ko: "가상화폐 자동매매 프로그램"
    images:
      - url: "/images/projects/trade-1.jpg"
        orientation: portrait
      - url: "/images/projects/trade-2.png"
        orientation: portrait
      - url: "/images/projects/trade-3.jpg"
        orientation: portrait
      - url: "/images/projects/trade-4.svg"
        orientation: landscape
    team:
      size: 1
    period:
      period_str: "2021.05 ~ 2023.07"
      type: development
    status:
      ko: "서비스 종료"
      color: warning
    specs:
      - go
      - python
      - mysql
      - docker
    resume_description:
      - type: list
        inner:
          - ko: "UPbit API와 Telegram Bot API를 활용한 투자 전략을 자동화한 가상화폐 트레이딩 봇 프로그램"
    description:
      - type: paragraph
        inner:
          ko: "투자 알고리즘을 직접 구현한 투자 자동화 프로그램입니다.실제 자본을 투입해 약간의 수익을 달성하긴 했지만, 알고리즘이 반드시 일반 투자보다 우월하지 않음을 배웠습니다."

      - type: list
        inner:
          - ko: "래리 윌리엄스의 변동성 돌파 전략을 참고한 투자 알고리즘 설계"
          - ko: "UPbit 거래소에서 WebSocket Client을 통해 실시간 가격 정보 수신"
          - ko: "Telegram Bot API를 통해 실시간 매수, 매도 시그널 전송"