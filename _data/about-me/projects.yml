data:
  - title:
      ko: "AI Agent-based Augmented Reading eXperience (AReX)"
      en: "AI Agent-based Augmented Reading eXperience (AReX)"
    status:
      ko: "대회 참가작"
      en: "Competition Entry"
      color: info
    images:
      - url: "/images/projects/arex-1.png"
        orientation: landscape
      - url: "/images/projects/arex-2.png"
        orientation: landscape
      - url: "/images/projects/arex-3.png"
        orientation: landscape
      - url: "/images/projects/arex-4.png"
        orientation: landscape
      - url: "/images/projects/arex-5.svg"
        orientation: portrait
      - url: "/images/projects/arex-6.svg"
        orientation: landscape
      - url: "/images/projects/arex-7.svg"
        orientation: portrait
    team:
      name:
        ko: "The Geppettos"
        en: "The Geppettos"
      size: 2
    period:
      period_str: "2025.07 ~ 2025.10"
      type: development
    specs:
      - typescript
      - react
      - express
      - python
      - docker
      - rabbitmq
      - postgresql
      - langchain
      - chroma
    brief_description:
      - type: list
        inner:
          - ko: "<b>AI Agent 및 RAG 기반</b>의 소설 특화 대화형 전자책 서비스 (대회 출품작)"
            en: "AI Agent and RAG-based interactive e-book service specialized for novels (competition entry)"
    description:
      - type: link_buttons
        inner:
          - label:
              ko: "소스코드"
              en: "Source Code"
            url: "https://github.com/The-Geppettos/AReX"
          - label:
              ko: "소개 영상"
              en: "Introduction Video"
            url: "https://youtu.be/uCMB6xpeiUM"

      - type: paragraph
        inner:
          ko: "AReX는 Agent AI-based Augmented Reading eXperience의 약자로, 소설책에 특화된 LLM 기반 전자책 서비스입니다. 대학 동기와 함께 개발하였으며, <b>오픈소스 개발자대회</b>와 <b>사이드임팩트</b> 출품작입니다. 독서량 감소 문제를 해결하고 소설책을 더 즐겁게 읽을 수 있는 방법을 고민하며 착안한 아이디어로, 소설 속 등장인물을 모방하는 <b>대화형 챗봇 기능</b>을 제공합니다. <b>Agent 기반 아키텍처</b>를 도입하여 필요에 따라 다양한 Tool(RAG 기반 문맥 검색 등)을 동적으로 호출하도록 구현했으며, 사용자의 <b>현재 독서 페이지 시점</b>에 맞춰 등장인물과 대화하도록 함으로써 스포일러 없이 더욱 생동감 있고 몰입도 높은 인터랙티브 독서 경험을 제공합니다."
          en: "AReX stands for Agent AI-based Augmented Reading eXperience, an LLM-based e-book service specialized for novels. It was developed with a college friend and was submitted to an open source developer competition and Side Impact. The idea was conceived to address the issue of declining reading habits and to enhance the enjoyment of reading novels by providing an interactive chatbot feature that mimics characters from the novels. By adopting an <b>Agent-based architecture</b>, the chatbot dynamically calls defined tools (e.g., RAG-based context retrieval). Furthermore, interactions with characters are synchronized to the user's <b>current reading page POV</b>, delivering a lively, spoiler-free, and immersive interactive reading experience."

      - type: list
        inner:
          - ko: "<b>AI Agent 기반 챗봇 설계 및 Tool Call 구조</b>"
            en: "AI Agent-based chatbot design and Tool Call structure"
          - sublist: true
            inner:
              - ko: "<b>Tool 정의 및 동적 호출</b>: 답변 생성에 필요한 정보를 불러오기 위해 정의된 Tool을 상황에 맞게 선택하여 실행"
                en: "<b>Tool Definition & Dynamic Invocation</b>: Dynamically select and call defined tools to retrieve necessary information for user answers"
          - ko: "<b>챗봇 모드</b>"
            en: "Chatbot Modes"
          - sublist: true
            inner:
              - ko: "<b>도우미 모드</b>: 독서 중 궁금한 점을 질문하고 답변 제공"
                en: "<b>Helper Mode</b>: Ask questions about the book and provide answers"
              - ko: "<b>등장인물 모드</b>: 사용자의 <b>현재 독서 페이지 시점</b>에 맞춰 등장인물의 말투, 지식, 상황을 재현하여 대화"
                en: "<b>Character Mode</b>: Recreate character tone and knowledge synchronized with the user's <b>current reading page POV</b>"
          - ko: "<b>RAG (Retrieval-Augmented Generation) 기반 시점 맞춤형 문맥 제공</b>"
            en: "RAG (Retrieval-Augmented Generation) based POV-customized context provision"
          - sublist: true
            inner:
              - ko: "사용자가 현재까지 읽은 범위(페이지 시점) 내로 한정된 문맥을 제공하여 스포일러 방지 및 생동감 있는 대화 유도"
                en: "Limit context up to the user's current reading page to prevent spoilers and enhance realistic interaction"
          - ko: "책 원문 <b>전처리 파이프라인 아키텍처 설계</b>"
            en: "Designing book text preprocessing pipeline architecture"

  - title:
      ko: "실시간 신체 분할 기반 인물 재식별(Re-ID) 모델"
      en: "Real-time Body Part-Based Person Re-Identification Model"
    status:
      ko: "오픈소스"
      en: "Open Source"
      color: success
    images:
      - url: "/images/22/model-architecture.jpg"
        orientation: landscape
      - url: "/images/22/comparison-diagram.jpg"
        orientation: landscape
    period:
      period_str: "2024.07 ~"
      type: development
    specs:
      - python
      - pytorch
      - onnx
      - react
      - typescript
    brief_description:
      - type: list
        inner:
          - ko: "실제 CCTV 관제 환경을 고려해 속도, 정확도, 커버리지, 일반화 성능를 최적화한 <b>실시간 인물 재식별(Re-ID) 모델</b> 및 <b>온디바이스 웹 데모</b>"
            en: "A real-time person re-identification (Re-ID) model and on-device web demo optimized for speed, accuracy, and coverage in real-world CCTV environments"
    description:
      - type: link_buttons
        inner:
          - label:
              ko: "소스코드"
              en: "Source Code"
            url: "https://github.com/juhonamnam/realtime-re-id"
          - label:
              ko: "데모 페이지"
              en: "Demo Page"
            url: "https://juhonamnam.github.io/realtime-re-id/"
          - label:
              ko: "개발기"
              en: "Development Story"
            url: "https://juhonamnam.github.io/blog/post/22"

      - type: paragraph
        inner:
          ko: "실제 카메라 환경을 고려해 설계한 <b>신체 분할 기반 인물 재식별(Re-ID) 시스템</b>입니다. BPBReID 구조를 기반으로 하되, <b>속도와 정확도 사이의 트레이드오프를 고려한 백본</b>을 설계했습니다. 또한 단일 데이터셋의 정확도가 아닌 <b>일반화 성능을 우선시</b>하여 실제 서비스 환경에 더 적합한 학습 방법을 구상하고, 가림 및 잘림 현상에서도 견고하게 동작하는 <b>Quality Filtering의 커버리지까지 고려한 설계</b>를 적용했습니다. 최종적으로는 웹 브라우저에서 100% 온디바이스로 구동하는 <b>YOLO + Re-ID 라이브 데모 웹 서비스</b>를 구축했습니다."
          en: "This is a body part-based person re-identification (Re-ID) system designed with real camera environments in mind. Based on the BPBReID structure, we designed a backbone that considers the trade-off between speed and accuracy. Additionally, we prioritized generalization performance over single dataset accuracy to devise a training method more suitable for real-world service environments, and applied a design that also considers the coverage of Quality Filtering to ensure robust operation even in occluded or cropped scenarios. Ultimately, we built a YOLO + Re-ID live demo web service that runs 100% on-device in web browsers."

      - type: list
        inner:
          - ko: "<b>경량 백본 네트워크 설계</b>"
            en: "Lightweight backbone network design"
          - sublist: true
            inner:
              - ko: "기존 HRNet 백본 대비 경량 모델인 ResNet, MobileNet 등에 <b>FPN을 결합한 구조</b> 설계"
                en: "Designed a structure that combines FPN with lightweight models such as ResNet and MobileNet compared to the existing HRNet backbone"
              - ko: "2배에서 4배까지의 <b>속도 향상</b>과 이에 따른 <b>정확도 손실 트레이드오프</b>를 고려한 백본 설계"
                en: "Backbone design considering a 2x to 4x speedup vs. accuracy trade-off"
          - ko: "<b>Quality Filtering의 커버리지를 고려한 설계</b>"
            en: "Design considering the coverage of Quality Filtering"
          - sublist: true
            inner:
              - ko: "엄격한 필터링: 높은 정확도와 낮은 커버리지"
                en: "Strict Filtering: High accuracy and low coverage"
              - ko: "느슨한 필터링: 낮은 정확도와 높은 커버리지"
                en: "Loose Filtering: Low accuracy and high coverage"
          - ko: "ANN 알고리즘 활용 가능성을 고려한 <b>단일 고정 길이 벡터 병합 구조 설계</b>"
            en: "Design of a single fixed-length vector concatenation structure considering the applicability of ANN algorithms"
          - sublist: true
            inner:
              - ko: "신체 부위별 거리를 비교하는 기존 구조가 아닌, 하나의 고정 길이 벡터로 병합하여 <b>ANN 알고리즘 활용 가능</b>"
                en: "Merged into a single fixed-length vector instead of comparing distances for each body part, enabling the use of ANN algorithms"
          - ko: "<b>Multi-task Learning 및 데이터셋 통합을 통한 일반화 성능 개선</b>"
            en: "Improved generalization performance via Multi-task Learning and dataset integration"
          - sublist: true
            inner:
              - ko: "COCO DensePose 및 다종 Re-ID 데이터셋(Market1501, DukeMTMC, AI Hub 등) 동시 학습"
                en: "Simultaneous training on COCO DensePose and multiple Re-ID datasets (Market1501, DukeMTMC, AI Hub, etc.)"
              - ko: "단일 데이터셋의 성능보다 <b>일반화 성능</b>을 우선시하여 <b>실제 서비스 환경에서의 적합성 향상</b>"
                en: "Prioritized <b>generalization performance</b> over single dataset performance to <b>enhance suitability in real-world service environments</b>"
          - ko: "<b>onnxruntime-web 기반 100% 온디바이스 웹 데모 페이지 개발</b>"
            en: "Developed a 100% on-device web demo page using onnxruntime-web"

  - title:
      ko: "모바일 청첩장"
      en: "Mobile Wedding Invitation"
    images:
      - url: "/images/projects/wedding-invitation-1.png"
        orientation: portrait
      - url: "/images/projects/wedding-invitation-2.png"
        orientation: portrait
      - url: "/images/projects/wedding-invitation-3.png"
        orientation: portrait
      - url: "/images/projects/wedding-invitation-4.png"
        orientation: portrait
      - url: "/images/projects/wedding-invitation-5.png"
        orientation: portrait
      - url: "/images/projects/wedding-invitation-6.png"
        orientation: portrait
    period:
      period_str: "2024.03 ~"
      type: development
    status:
      ko: "오픈소스"
      en: "Open Source"
      color: success
    specs:
      - react
      - go
      - typescript
      - sass
      - nginx
      - sqlite
    brief_description:
      - type: list
        inner:
          - ko: "실제 결혼식을 위해 제작한 <b>React 기반 맞춤형 모바일 청첩장 템플릿</b> (2026년 6월 기준 <b>fork 100개 돌파</b>)"
            en: "React-based custom mobile wedding invitation template developed for my own wedding (over 100 forks as of June 2026)"
    description:
      - type: link_buttons
        inner:
          - label:
              ko: "소스코드"
              en: "Source Code"
            url: "https://github.com/juhonamnam/wedding-invitation"
          - label:
              ko: "청첩장 샘플"
              en: "Wedding Invitation Sample"
            url: "https://juhonamnam.github.io/wedding-invitation"
          - label:
              ko: "개발기"
              en: "Development Story"
            url: "https://juhonamnam.github.io/blog/post/18"

      - type: paragraph
        inner:
          ko: "실제 저의 결혼식을 위해 직접 제작한 <b>React 기반 모바일 청첩장</b>입니다. 기존 서비스 디자인의 제약을 극복하기 위해 UI를 직접 설계하고, 도메인을 구입하여 <b>Naver Cloud Platform에 배포</b>해 실제로 사용했습니다. 단순한 개인 용도에서 출발했지만 다른 사용자들의 문의가 들어오면서 <b>오픈소스 템플릿</b>으로 전환했습니다. 현재 재사용성과 확장성을 고려해 지속적으로 개선하고 있습니다."
          en: "This is a React-based mobile wedding invitation that I personally developed for my own wedding. To overcome the design limitations of existing services, I designed the UI myself, purchased a domain, and deployed it on Naver Cloud Platform for actual use. Although it started as a simple personal project, it was converted into an open-source template due to inquiries from other users. I am continuously improving it with reusability and scalability in mind."

      - type: list
        inner:
          - ko: "다양한 모바일 화면 사이즈에 대응하는 <b>반응형 웹 디자인</b>"
            en: "Responsive web design for various mobile screen sizes"
          - ko: "캐러셀, 모달, 방명록 등 복합적인 <b>Event 기반 UI 기능 구현</b>"
            en: "Complex event based UI features such as carousel, modal, and guestbook"
          - ko: "도메인 연동과 SSL 인증서로 <b>Naver Cloud Platform 배포</b>"
            en: "Deployment on Naver Cloud Platform along with connecting domain and SSL certification"
          - ko: "Naver Map API, Kakao SDK 등 <b>외부 API 연동</b>"
            en: "Integration with external APIs such as Naver Map API and Kakao SDK"
          - ko: "2026년 6월 기준 <b>fork 100개 돌파</b>"
            en: "<b>Achieved over 100 forks</b> as of June 2026"

  - title:
      ko: "가상화폐 자동매매 프로그램"
      en: "Cryptocurrency Automated Trading Program"
    images:
      - url: "/images/projects/trade-1.jpg"
        orientation: portrait
      - url: "/images/projects/trade-2.png"
        orientation: portrait
      - url: "/images/projects/trade-3.jpg"
        orientation: portrait
      - url: "/images/projects/trade-4.svg"
        orientation: landscape
    period:
      period_str: "2021.05 ~ 2023.07"
      type: development
    status:
      ko: "서비스 종료"
      en: "Service Discontinued"
      color: warning
    specs:
      - go
      - python
      - mysql
      - docker
    brief_description:
      - type: list
        inner:
          - ko: "투자 전략을 자동화한 <b>가상화폐 트레이딩 봇 프로그램</b>"
            en: "A cryptocurrency trading bot program that automates investment strategies"
    description:
      - type: paragraph
        inner:
          ko: "프로그래밍 입문 시 개발한 투자 알고리즘 자동화 프로그램입니다. 래리 윌리엄스의 <b>변동성 돌파 전략</b>을 참고해 투자 알고리즘을 직접 설계하고, Python과 UPbit Open API를 활용해 <b>매수·매도 로직을 자동화</b>했습니다. 또한 투자 전략으로 AI 기반 모델 활용 가능성을 검토해 보기도 했습니다. 실제 자본을 투입해 <b>약 10%의 누적 수익</b>을 냈으며, 이후에는 메신저봇을 통한 모의투자 시그널 시스템으로 발전시켰습니다. 실제 수익을 달성하긴 했지만, 알고리즘이 반드시 일반 투자보다 우월하지 않음을 배웠습니다."
          en: "This is an automated trading program developed when I first started programming. I designed a trading algorithm based on Larry Williams' volatility breakout strategy and automated the buy and sell logic using Python and UPbit Open API. I also explored the possibility of using AI-based models for trading strategies. I achieved a cumulative return of about 10% with real capital, and later evolved it into a mock trading signal system through a messenger bot. Although I achieved actual profits, I learned that algorithms are not necessarily superior to general investing."

      - type: list
        inner:
          - ko: "래리 윌리엄스의 변동성 돌파 전략을 참고해 <b>투자 알고리즘을 직접 설계</b>"
            en: "Design and implement a trading algorithm based on Larry Williams' volatility breakout strategy"
          - ko: "거래소에서 WebSocket Client을 통해 <b>실시간 가격 정보 수신</b>"
            en: "Receive real-time price information from exchanges via WebSocket Client"
          - ko: "Telegram Bot API를 통해 <b>실시간 매수, 매도 시그널 전송</b>"
            en: "Send real-time buy and sell signals via Telegram Bot API"
          - ko: "<b>누적 수익률 10% 달성</b>"
            en: "Achieved cumulative return of 10%"