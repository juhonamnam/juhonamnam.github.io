data:
  - period: "2023.02 - Present"
    company: "CPRO"
    job_title:
      ko: "웹 풀스텍 & AI 엔지니어"
      en: "Web Full-stack & AI Engineer"
    specs:
      - typescript
      - express
      - go
      - react
      - nextjs
      - aws
      - mongodb
      - docker
      - python
      - pytorch
    affiliation:
      ko: "RetailTrend 개발팀"
      en: "RetailTrend Development Team"
    brief_description:
      - type: list
        inner:
          - ko: "하루 약 500만 건의 트래픽을 처리하는 서비스의 데이터 파이프라인 관리 및 개선"
            en: "Data pipeline management and improvement of a service that handles approximately 5 million traffic per day"
          - ko: "DB 쿼리 튜닝, 아키텍처 재설계 등을 통한 서비스 장애 및 병목 현상 해결"
            en: "Resolved service outages and bottlenecks through query optimization and architectural redesign"
          - ko: "서비스 운영 비용 절감 (AWS S3 비용 약 40% 절감)"
            en: "Service Cost Reduction"
          - ko: "카메라 기반 Re-Identification (ReID) AI 모델 연구 개발 및 온디바이스 배포"
            en: "Camera-based Re-Identification (ReID) AI Model Research, Development and on-device deployment"
    description:
      - type: paragraph
        inner:
          ko: "AI 카메라 기반 매장 방문객 분석 서비스인 RetailTrend 개발에 참여하고 있습니다. 하루 약 500만 건의 트래픽을 처리하는 중앙 서버를 유지보수하며 신규 기능 개발부터 장애 대응 및 최적화까지 다양한 업무를 수행해 왔습니다."
          en: "I am involved in the development of RetailTrend, an AI camera-based store visitor analysis service. I have been maintaining a central server that handles approximately 5 million traffic per day, performing various tasks from developing new features to responding to outages and optimizations."

      - type: link_buttons
        inner:
          - label:
              ko: "RetailTrend 소개 페이지"
              en: "RetailTrend Introduction Page"
            url: "https://www.retailtrend.com"

      - type: heading
        inner:
          ko: "담당 분야"
          en: "Areas of Responsibility"

      - type: list
        inner:
          - ko: "데이터 처리 파이프라인"
            en: "Data processing pipeline"
          - sublist: true
            inner:
              - ko: "카메라 데이터에서 사용자에게 유의미한 정보까지의 과정을 처리하는 데이터 파이프라인 설계 및 구현"
                en: "Design and implement a data pipeline that processes camera data into meaningful information for users"
          - ko: "Vision AI 모델 연구 개발"
            en: "Vision AI model research and development"
          - sublist: true
            inner:
              - ko: "카메라 온디바이스 Re-Identification (ReID) AI 모델 연구 개발"
                en: "Research and development of camera on-device Re-Identification (ReID) AI models"
          - ko: "서비스 운영 및 최적화"
            en: "Service operation and optimization"
          - sublist: true
            inner:
              - ko: "AWS 클라우드 기반 서비스 운영, 모니터링 및 최적화"
                en: "AWS cloud-based service operation, monitoring, and optimization"

      - type: heading
        inner:
          ko: "주요 문제 해결 및 기여"
          en: "Problem Solving and Contribution"

      - type: list
        inner:
          - ko: "콘텐츠 데이터의 구조적 문제 해결 및 기술 부채 해소를 통한 서비스 확장성 개선"
            en: "Improved service scalability by resolving structural issues in content data and addressing technical debt"
          - ko: "DB 쿼리 튜닝, 아키텍처 재설계 등을 통한 서비스 장애 및 병목 현상 해결"
            en: "Resolved service outages and bottlenecks through query optimization and architectural redesign"
          - ko: "서비스 운영 비용 절감 (AWS S3 비용 약 40% 절감)"
            en: "Service Cost Reduction (approximately 40% reduction in AWS S3 costs)"

  - period: "2021.12 - 2023.01"
    company: "J&FIRST"
    job_title:
      ko: "프론트엔드 개발자"
      en: "Frontend Developer"
    specs:
      - react
      - nextjs
      - typescript
      - graphql
      - spring
      - mysql
      - nginx
      - java
    affiliation:
      ko: "개발팀"
      en: "Development Team"
    brief_description:
      - type: list
        inner:
          - ko: "LINE Plus 외주 프론트엔드 개발자"
            en: "Outsourced Frontend Developer for LINE Plus"
          - ko: "팀 내 공통 소스코드 관리 및 개선"
            en: "Common source code management and improvement within the team"
          - ko: "사용자 경험 최적화 (페이지 로딩 시간 약 50% 개선)"
            en: "Optimized user experience (approximately 50% improvement in page loading time)"
          - ko: "신규 기술 선행 학습 및 적용 가이드 수립"
            en: "Preliminary learning of new technologies and establishment of application guides"
    description:
      - type: paragraph
        inner:
          ko: "LINE Plus의 외주 프로젝트에 프론트엔드 개발자로 참여했습니다."
          en: "I participated as a frontend developer in an outsourced project for LINE Plus."

      - type: heading
        inner:
          ko: "담당 분야"
          en: "Areas of Responsibility"

      - type: list
        inner:
          - ko: "React 기반 관리자용 웹 서비스의 프론트엔드 개발"
            en: "Frontend development of React-based admin web services"
          - sublist: true
            inner:
              - ko: "LINE Monary, LINE Shopping 등의 서비스 콘텐츠 및 데이터 관리 UI 구현"
                en: "Implemented content and data management UI for services such as LINE Monary and LINE Shopping"
          - ko: "팀 내 공통 소스코드 관리 및 개선"
            en: "Common source code management and improvement within the team"
          - sublist: true
            inner:
              - ko: "프로젝트간 재사용 가능한 공통 컴포넌트 및 유틸리티 라이브러리 개발"
                en: "Research and development of camera on-device Re-Identification (ReID) AI models"
          - ko: "신규 기술 선행 학습 및 적용 가이드 수립"
            en: "Preliminary learning of new technologies and establishment of application guides"
          - sublist: true
            inner:
              - ko: "Next.js, GraphQL, Naver SmartEditor ONE (네이버 블로그 작성 시 사용되는 에디터) 등의 신규 기술 선행 학습 및 팀 내 적용 가이드 수립"
                en: "Preliminary learning of new technologies such as Next.js, GraphQL, and Naver SmartEditor ONE (the editor used for writing Naver blogs) and establishment of application guides within the team"

      - type: heading
        inner:
          ko: "주요 문제 해결 및 기여"
          en: "Problem Solving and Contributions"

      - type: list
        inner:
          - ko: "캐싱 정책 개선으로 서비스 전반의 페이지 로딩 시간 약 50% 개선"
            en: "Improved overall page loading time of the service by approximately 50% through caching policy improvements"
          - ko: "소스코드 관리 정책 수립하여 개발 생산성 향상"
            en: "Enhancing development productivity by establishing source code management policies"
          - ko: "팀 내 또는 외부 개발팀과의 소스코드 충돌 해결"
            en: "Resolving source code conflicts within the team or with external development teams"