data:
  - period: "2023.02 - Present"
    company: "CPRO"
    job_title:
      ko: "백엔드 & AI 엔지니어"
    specs:
      - typescript
      - express
      - go
      - react
      - nextjs
      - aws
      - mongodb
      - docker
      - python
      - pytorch
    affiliation:
      ko: "RetailTrend 개발팀"
    resume_description:
      - type: paragraph
        inner:
          ko: "AI 카메라 기반 매장 방문객 분석 서비스인 RetailTrend 개발에 참여하고 있습니다."
      - type: heading
        inner:
          ko: "What I did"
      - type: list
        inner:
          - ko: "하루 약 800만 건의 트래픽을 처리하는 중앙 서버 유지보수 및 신규 기능 개발"
          - ko: "카메라 데이터 가공 과정을 처리하는 데이터 파이프라인 설계 및 구현"
          - ko: "데이터 콘텐츠 공통 처리 구조 설계하여 예외 상황 처리 및 데이터 불일치 문제 해결"
          - ko: "AWS 클라우드 기반 서비스 운영, 모니터링 및 비용 최적화 (AWS S3 비용 약 40% 절감)"
          - ko: "DB 쿼리 프로파일링 및 스레드풀 분산을 통한 병목 현상 해결"
          - ko: "카메라 기반 Re-Identification AI 모델 연구 및 개발"
    description:
      - type: paragraph
        inner:
          ko: "AI 카메라 기반 매장 방문객 분석 서비스인 RetailTrend 개발에 참여하고 있습니다. 하루 약 800만 건의 트래픽을 처리하는 중앙 서버를 유지보수하며 신규 기능 개발부터 장애 대응 및 최적화까지 다양한 업무를 수행해 왔습니다."

      - type: link_buttons
        inner:
          - label:
              ko: "RetailTrend 소개 페이지"
            url: "https://www.retailtrend.com"

      - type: heading
        inner:
          ko: "담당 분야"

      - type: list
        inner:
          - ko: "데이터 처리 파이프라인"
          - sublist: true
            inner:
              - ko: "카메라 데이터에서 사용자에게 유의미한 정보까지의 과정을 처리하는 데이터 파이프라인 설계 및 구현"
          - ko: "Vision AI 모델 연구 개발"
          - sublist: true
            inner:
              - ko: "카메라 온디바이스 Re-Identification (ReID) AI 모델 연구 개발"
          - ko: "서비스 운영 및 최적화"
          - sublist: true
            inner:
              - ko: "AWS 클라우드 기반 서비스 운영, 모니터링 및 최적화"

      - type: heading
        inner:
          ko: "주요 문제 해결 및 기여"

      - type: list
        inner:
          - ko: "콘텐츠 데이터의 구조적 문제 해결 및 기술 부채 해소를 통한 서비스 확장성 개선"
          - ko: "DB 쿼리 튜닝, 아키텍처 재설계 등을 통한 서비스 장애 및 병목 현상 해결"
          - ko: "서비스 운영 비용 절감 (AWS S3 비용 약 40% 절감)"

  - period: "2021.12 - 2023.01"
    company: "J&FIRST"
    job_title:
      ko: "프론트엔드 개발자"
    specs:
      - react
      - nextjs
      - typescript
      - graphql
      - spring
      - mysql
      - nginx
      - java
    affiliation:
      ko: "개발팀"
    resume_description:
      - type: paragraph
        inner:
          ko: "LINE Plus의 외주 프로젝트에서 프론트엔드 개발을 담당했습니다."
      - type: heading
        inner:
          ko: "What I did"
      - type: list
        inner:
          - ko: "React Hook Form 기반의 deeply nested form 구현"
          - ko: "팀 내 공통 소스코드 관리 및 개선"
          - ko: "캐싱 정책을 통한 페이지 로딩 시간 개선 (2400ms → 1300ms)"
          - ko: "Next.js, GraphQL 등 신규 기술 선행 학습 및 활용 가이드 수립"
          - ko: "팀 내 또는 외부 개발팀과의 소스코드 충돌 해결"
          - ko: "Java Spring 기반의 백엔드 보조 업무 수행"
    description:
      - type: paragraph
        inner:
          ko: "LINE Plus의 외주 프로젝트에 프론트엔드 개발자로 참여했습니다."

      - type: heading
        inner:
          ko: "담당 분야"

      - type: list
        inner:
          - ko: "React 기반 관리자용 웹 서비스의 프론트엔드 개발"
          - sublist: true
            inner:
              - ko: "LINE Monary, LINE Shopping 등의 서비스 콘텐츠 및 데이터 관리 UI 구현"
          - ko: "팀 내 공통 소스코드 관리 및 개선"
          - sublist: true
            inner:
              - ko: "프로젝트간 재사용 가능한 공통 컴포넌트 및 유틸리티 라이브러리 개발"
          - ko: "신규 기술 선행 학습 및 적용 가이드 수립"
          - sublist: true
            inner:
              - ko: "Next.js, GraphQL, Naver SmartEditor ONE (네이버 블로그 작성 시 사용되는 에디터) 등의 신규 기술 선행 학습 및 팀 내 적용 가이드 수립"

      - type: heading
        inner:
          ko: "주요 문제 해결 및 기여"

      - type: list
        inner:
          - ko: "캐싱 정책 개선으로 서비스 전반의 페이지 로딩 시간 약 50% 개선"
          - ko: "소스코드 관리 정책 수립하여 개발 생산성 향상"
          - ko: "팀 내 또는 외부 개발팀과의 소스코드 충돌 해결"