data:
  - period: "2023.02 - Present"
    company: "CPRO"
    job_title:
      ko: "백엔드 & AI 엔지니어"
    specs:
      - typescript
      - express
      - go
      - react
      - nextjs
      - aws
      - mongodb
      - docker
      - python
      - pytorch
    affiliation:
      ko: "RetailTrend 개발팀"
    resume_description:
      - type: paragraph
        inner:
          ko: "AI 카메라 기반 매장 방문객 분석 서비스인 RetailTrend 개발에 참여하고 있습니다."
      - type: list
        inner:
          - ko: "하루 약 800만 건의 트래픽을 처리하는 중앙 서버 유지보수 및 신규 기능 개발"
          - ko: "서비스 핵심 데이터 로직 구조 개선 및 성능 최적화"
          - ko: "트래픽 증가에 따른 서비스 수평 확장 구조 설계"
          - ko: "SFTP 기반 데이터 전송 시스템 설계 구현"
          - ko: "시간별 데이터 집계 및 데이터 동기화 로직 개선"
          - ko: "AWS 클라우드 기반 서비스 운영, 모니터링 및 비용 최적화 (AWS S3 비용 약 40% 절감)"
          - ko: "Multi-camera tracking을 위한 Re-Identification AI 모델 연구 및 개발"
    description:
      - type: paragraph
        inner:
          ko: "AI 카메라 기반 매장 방문객 분석 서비스인 RetailTrend 개발에 참여하고 있습니다. 하루 약 800만 건의 트래픽을 처리하는 중앙 서버를 유지보수하며 신규 기능 개발부터 장애 대응 및 최적화까지 다양한 업무를 수행해 왔습니다."

      - type: link_buttons
        inner:
          - label:
              ko: "RetailTrend 소개 페이지"
            url: "https://www.retailtrend.com"

      - type: heading
        inner:
          ko: "What I did"
      - type: list
        inner:
          - ko: "서비스 핵심 데이터 로직 구조 개선 및 성능 최적화"
          - ko: "트래픽 증가에 따른 서비스 수평 확장 구조 설계"
          - ko: "SFTP 기반 데이터 전송 시스템 설계 구현"
          - ko: "시간별 데이터 집계 및 데이터 동기화 로직 개선"
          - ko: "AWS 클라우드 기반 서비스 운영, 모니터링 및 비용 최적화 (AWS S3 비용 약 40% 절감)"
          - ko: "Multi-camera tracking을 위한 Re-Identification AI 모델 연구 및 개발"

      - type: heading
        inner:
          ko: "문제 해결 사례: 대규모 트래픽 서버의 병목 해결"

      - type: paragraph
        inner:
          ko: "서비스가 확장됨에 따라 Node.js 기반의 중앙 서버에서 병목 현상이 발생했고 이를 해결한 사례입니다."

      - type: text
        inner:
          ko: "<i>코드 레벨 최적화</i>"
      - type: list
        inner:
          - ko: "MongoDB Profiler를 통해 비효율적인 Aggregation 쿼리 발견 (COLLSCAN 발생)"
          - sublist: true
            inner:
              - ko: "개선 이후 실행 시간 약 20배 단축 (200ms → 10ms)"
          - ko: "Node.js의 single-threaded 특성으로 인해 CPU-bound 작업 부하"
          - sublist: true
            inner:
              - ko: "CPU-intensive 작업은 Worker Thread Pool을 활용하여 분산 처리하도록 개선"

      - type: text
        inner:
          ko: "<i>아키텍처 레벨 개선</i>"
      - type: list
        inner:
          - ko: "서비스 수평 확장을 위해 Stateless 애플리케이션 구조로 전환"
          - sublist: true
            inner:
            - ko: "자체 메모리 캐시 및 Mutex 등 기존의 단일 인스턴스 환경을 전제로 한 상태 관리 로직 분석 후 제거"
          - ko: "서비스 특성상 대부분이 내부 트래픽임을 확인하고, 외부 트래픽과 내부 트래픽 격리"

  - period: "2021.12 - 2023.01"
    company: "J&FIRST"
    job_title:
      ko: "프론트엔드 개발자"
    specs:
      - react
      - nextjs
      - typescript
      - graphql
      - spring
      - mysql
      - nginx
      - java
    affiliation:
      ko: "개발팀"
    resume_description:
      - type: paragraph
        inner:
          ko: "LINE Plus의 외주 프로젝트에서 프론트엔드 개발을 담당했습니다."
      - type: list
        inner:
          - ko: "LINE 서비스 콘텐츠 관리 시스템의 웹 UI 개발"
          - ko: "React Hook Form 기반으로 중첩 객체 및 배열 등 복잡한 form 로직 구현"
          - ko: "페이지 로딩 시간 단축을 통한 사용자 경험 개선 (2400ms → 1300ms)"
          - ko: "Next.js, GraphQL, Naver SmartEditor ONE 등 신규 기술 도입을 위한 선행 연구"
          - ko: "팀 내 공통 소스코드 관리 정책 수립"
          - ko: "팀 내 또는 외부 개발팀과의 소스코드 충돌 해결"
    description:
      - type: paragraph
        inner:
          ko: "LINE Plus의 관리자용 웹 서비스 외주 프로젝트에 프론트엔드 개발자로 참여했습니다."

      - type: heading
        inner:
          ko: "What I did"
      - type: list
        inner:
          - ko: "LINE 서비스 콘텐츠 관리 시스템의 웹 UI 개발"
          - ko: "React Hook Form 기반으로 중첩 객체 및 배열 등 복잡한 form 로직 구현"
          - ko: "페이지 로딩 시간 단축을 통한 사용자 경험 개선 (2400ms → 1300ms)"
          - ko: "Next.js, GraphQL, Naver SmartEditor ONE 등 신규 기술 도입을 위한 선행 연구"
          - ko: "팀 내 공통 소스코드 관리 정책 수립"
          - ko: "팀 내 또는 외부 개발팀과의 소스코드 충돌 해결"

      - type: heading
        inner:
          ko: "문제 해결 사례: 웹 페이지 로딩 시간 개선"

      - type: paragraph
        inner:
          ko: "타사에서 진행한 유사 LINE Plus 외주 프로젝트 대비 페이지 로딩이 느리다는 피드백이 있었고, 원인을 분석하여 개선한 사례입니다."

      - type: text
        inner:
          ko: "<i>원인 분석: 비활성화된 브라우저 캐싱</i>"
      - type: list
        inner:
          - ko: "Inspect Tool을 활용하여 CPU 사용량 분포 분석: 대부분 유휴 상태임을 확인"
          - ko: "<code>css</code>와 <code>js</code> 정적 리소스 다운로드에 상당 시간 소요"
          - ko: "브라우저 캐싱을 전혀 사용하지 않아 매번 정적 리소스를 새로 다운로드하는 구조"
          - ko: "소스코드 변경 사항 즉시 반영을 위해 <code>no-cache</code> 정책을 사용했던 것이 원인"

      - type: text
        inner:
          ko: "<i>개선 사항: 소스코드 변경 사항 즉시 반영과 캐싱을 동시에 활용</i>"
      - type: list
        inner:
          - ko: "Bundler 설정에서 정적 리소스 파일명에 hash를 적용하여 Cache Busting을 구현"
          - ko: "캐싱 정책은 기존으로 복구"
          - ko: "페이지 로딩 시간 약 45% 개선 (2400ms → 1300ms)"
