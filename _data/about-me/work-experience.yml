data:
  - period: "2023.02 - Present"
    company: "CPRO"
    job_title:
      ko: "백엔드 & AI 엔지니어"
    specs:
      - typescript
      - express
      - go
      - react
      - nextjs
      - aws
      - mongodb
      - docker
      - python
      - pytorch
    affiliation:
      ko: "RetailTrend 개발팀"
    resume_description:
      - type: paragraph
        inner:
          ko: "AI 카메라 기반 매장 방문객 분석 서비스인 RetailTrend 개발에 참여하고 있습니다."
      - type: heading
        inner:
          ko: "What I did"
      - type: list
        inner:
          - ko: "하루 약 800만 건의 트래픽을 처리하는 중앙 서버 유지보수 및 신규 기능 개발"
          - ko: "카메라 데이터 가공 과정을 처리하는 데이터 파이프라인 설계 및 구현"
          - ko: "데이터 콘텐츠 공통 처리 구조 설계하여 예외 상황 처리 및 데이터 불일치 문제 해결"
          - ko: "AWS 클라우드 기반 서비스 운영, 모니터링 및 비용 최적화 (AWS S3 비용 약 40% 절감)"
          - ko: "DB 쿼리 프로파일링 및 스레드풀 분산을 통한 병목 현상 해결"
          - ko: "카메라 기반 Re-Identification AI 모델 연구 및 개발"
    description:
      - type: paragraph
        inner:
          ko: "AI 카메라 기반 매장 방문객 분석 서비스인 RetailTrend 개발에 참여하고 있습니다. 하루 약 800만 건의 트래픽을 처리하는 중앙 서버를 유지보수하며 신규 기능 개발부터 장애 대응 및 최적화까지 다양한 업무를 수행해 왔습니다."

      - type: link_buttons
        inner:
          - label:
              ko: "RetailTrend 소개 페이지"
            url: "https://www.retailtrend.com"

      - type: heading
        inner:
          ko: "What I did"
      - type: list
        inner:
          - ko: "카메라 데이터 가공 과정을 처리하는 데이터 파이프라인 설계 및 구현"
          - ko: "데이터 콘텐츠 공통 처리 구조 설계하여 예외 상황 처리 및 데이터 불일치 문제 해결"
          - ko: "AWS 클라우드 기반 서비스 운영, 모니터링 및 비용 최적화 (AWS S3 비용 약 40% 절감)"
          - ko: "DB 쿼리 프로파일링 및 스레드풀 분산을 통한 병목 현상 해결"
          - ko: "카메라 기반 Re-Identification AI 모델 연구 및 개발"

      - type: heading
        inner:
          ko: "문제 해결 사례1: 대규모 트래픽 환경의 서버 성능 병목 분석 및 개선"

      - type: paragraph
        inner:
          ko: "트래픽이 많이 몰리면서 서비스가 전반적으로 느려지는 현상이 있었고, 아래 두 가지 관점으로 문제를 분석하고 개선했습니다."

      - type: paragraph
        inner:
          ko: "MongoDB Profiler를 통해 MongoDB Aggregation의 비효율적 쿼리 구조 발견 후 개선"
      - type: list
        inner:
          - ko: "<code>$match</code> 이전 <code>$lookup</code> 연산 수행으로 인해 full scan 발생"
          - ko: "<code>$lookup</code> 대상의 인덱스 부재로 인해 full scan 발생"
          - ko: "200ms 이상 소요되는 쿼리를 10ms 이하로 개선"
      - type: paragraph
        inner:
          ko: "Node.js의 single-threaded 특성으로 인해 CPU-bound 작업이 전체 서버 성능 저하를 유발하는 문제 발견"
      - type: list
        inner:
          - ko: "Worker Thread Pool을 활용하여 CPU-bound 작업을 분산 처리하도록 개선"

      - type: heading
        inner:
          ko: "문제 해결 사례2: 데이터 파이프라인 구조 안정성 개선"

      - type: paragraph
        inner:
          ko: "매장 카메라의 네트워크 환경에 따라 카메라에서 수집되는 데이터가 일부 누락되는 상황이 발생합니다. 이에 따라 지연된 데이터가 반영되지 않거나, 콘텐츠별 처리 시점의 차이로 데이터 불일치가 발생하는 문제가 있었습니다. 이를 해결하기 위해 데이터의 전체 흐름을 공통으로 처리할 수 있는 모듈을 따로 설계하여 모든 예외 상황을 처리할 수 있도록 개선했고, 이를 통해 앞으로 추가되는 신규 콘첸츠에 대한 확장성도 확보할 수 있었습니다."

  - period: "2021.12 - 2023.01"
    company: "J&FIRST"
    job_title:
      ko: "프론트엔드 개발자"
    specs:
      - react
      - nextjs
      - typescript
      - graphql
      - spring
      - mysql
      - nginx
      - java
    affiliation:
      ko: "개발팀"
    resume_description:
      - type: paragraph
        inner:
          ko: "LINE Plus의 외주 프로젝트에서 프론트엔드 개발을 담당했습니다."
      - type: heading
        inner:
          ko: "What I did"
      - type: list
        inner:
          - ko: "React Hook Form 기반의 deeply nested form 구현"
          - ko: "팀 내 공통 소스코드 관리 및 개선"
          - ko: "캐싱 정책을 통한 페이지 로딩 시간 개선 (2400ms → 1300ms)"
          - ko: "Next.js, GraphQL 등 신규 기술 선행 학습 및 활용 가이드 수립"
          - ko: "팀 내 또는 외부 개발팀과의 소스코드 충돌 해결"
          - ko: "Java Spring 기반의 백엔드 보조 업무 수행"
    description:
      - type: paragraph
        inner:
          ko: "LINE Plus의 관리자용 웹 서비스 외주 프로젝트에 프론트엔드 개발자로 참여했습니다."

      - type: heading
        inner:
          ko: "What I did"
      - type: list
        inner:
          - ko: "React Hook Form 기반의 deeply nested form 구현"
          - ko: "팀 내 공통 소스코드 관리 및 개선"
          - ko: "캐싱 정책을 통한 페이지 로딩 시간 개선 (2400ms → 1300ms)"
          - ko: "Next.js, GraphQL, Naver SmartEditor ONE (네이버 블로그 작성 시 사용되는 에디터) 등 신규 기술 선행 학습 및 활용 가이드 수립"
          - ko: "팀 내 또는 외부 개발팀과의 소스코드 충돌 해결"
          - ko: "Java Spring 기반의 백엔드 보조 업무 수행"

      - type: heading
        inner:
          ko: "문제 해결 사례: 웹 페이지 로딩 시간 개선"

      - type: paragraph
        inner:
          ko: "타사에서 참여한 또 다른 LINE Plus 외주 프로젝트와 비교하여 페이지 로딩 시간이 많이 느리다는 피드백을 받았습니다. React 컴포넌트의 렌더링에 집중한 다른 동료들과는 달리, 저는 원인 분석을 먼저 하기 위해 inspect tool을 사용했습니다. 그 결과, JavaScript 실행으로 인한 지연은 극히 적었고, 대부분의 지연이 네트워크 요청으로 인한 것임을 확인했습니다. 이에 따라 캐싱 정책을 개선하여 페이지 로딩 시간을 2400ms에서 1300ms로 단축시켰습니다."