data:
  - period: "2023.02 - Present"
    company: "CPRO"
    job_title:
      ko: "백엔드 & AI 엔지니어"
    specs:
      - typescript
      - express
      - go
      - react
      - nextjs
      - aws
      - mongodb
      - docker
      - python
      - pytorch
    affiliation:
      ko: "RetailTrend 개발팀"
    resume_description:
      - type: paragraph
        inner:
          ko: "AI 카메라 기반 매장 방문객 분석 서비스인 RetailTrend 개발에 참여하고 있습니다."
      - type: heading
        inner:
          ko: "What I did"
      - type: list
        inner:
          - ko: "하루 약 800만 건의 트래픽을 처리하는 중앙 서버 유지보수 및 신규 기능 개발"
          - ko: "카메라 데이터 가공 과정을 처리하는 데이터 파이프라인 설계 및 구현"
          - ko: "데이터 콘텐츠 공통 처리 구조 설계하여 예외 상황 처리 및 데이터 불일치 문제 해결"
          - ko: "AWS 클라우드 기반 서비스 운영, 모니터링 및 비용 최적화 (AWS S3 비용 약 40% 절감)"
          - ko: "MongoDB Aggregation 튜닝 및 스레드풀 분산을 통한 병목 현상 해결"
          - ko: "카메라 기반 Re-Identification AI 모델 연구 및 개발"
    description:
      - type: paragraph
        inner:
          ko: "AI 카메라 기반 매장 방문객 분석 서비스인 RetailTrend 개발에 참여하고 있습니다. 하루 약 800만 건의 트래픽을 처리하는 중앙 서버를 유지보수하며 신규 기능 개발부터 장애 대응 및 최적화까지 다양한 업무를 수행해 왔습니다."

      - type: link_buttons
        inner:
          - label:
              ko: "RetailTrend 소개 페이지"
            url: "https://www.retailtrend.com"

      - type: heading
        inner:
          ko: "What I did"
      - type: list
        inner:
          - ko: "카메라 데이터 가공 과정을 처리하는 데이터 파이프라인 설계 및 구현"
          - ko: "데이터 콘텐츠 공통 처리 구조 설계하여 예외 상황 처리 및 데이터 불일치 문제 해결"
          - ko: "AWS 클라우드 기반 서비스 운영, 모니터링 및 비용 최적화 (AWS S3 비용 약 40% 절감)"
          - ko: "MongoDB Aggregation 튜닝 및 스레드풀 분산을 통한 병목 현상 해결"
          - ko: "카메라 기반 Re-Identification AI 모델 연구 및 개발"

      - type: heading
        inner:
          ko: "문제 해결 사례 1: 대규모 트래픽 환경의 서버 성능 병목 분석 및 개선"

      - type: paragraph
        inner:
          ko: "서비스가 확장됨에 따라 병목 현상이 발생했고, 아래 두 가지 관점으로 문제를 분석하고 개선했습니다."

      - type: text
        inner:
          ko: "<i>MongoDB Profiler를 통해 MongoDB Aggregation의 비효율적 쿼리 구조 발견 후 개선</i>"
      - type: list
        inner:
          - ko: "<code>$match</code> 이전 <code>$lookup</code> 연산 수행으로 인해 COLLSCAN 발생"
          - ko: "<code>$lookup</code> 대상의 인덱스 부재로 인해 COLLSCAN 발생"
          - ko: "개선 이후 실행 시간 약 20배 단축 (200ms → 10ms)"
      - type: text
        inner:
          ko: "<i>Node.js의 single-threaded 특성으로 인해 CPU-bound 작업이 전체 서버 성능 저하를 유발하는 문제 발견</i>"
      - type: list
        inner:
          - ko: "Worker Thread Pool을 활용하여 CPU-bound 작업을 분산 처리하도록 개선"

      - type: heading
        inner:
          ko: "문제 해결 사례 2: 분산된 예외 처리 로직의 공통화"

      - type: paragraph
        inner:
          ko: "서비스상에 종종 발생하는 예외 상황에 대해 구조적으로 개선한 사례입니다."
      - type: text
        inner:
          ko: "<i>기존의 문제점</i>"
      - type: list
        inner:
          - ko: "매장 카메라의 네트워크 지연 또는 장애 복구로 인해 과거 시점의 데이터가 변경되는 상황이 자주 발생"
          - ko: "콘텐츠별로 개별 예외 로직을 구현하는 방식으로 대응하면서 기술 부채로 누적"
          - ko: "일부 예외 상황이 누락되어 콘텐츠별 데이터가 불일치하거나, 신규 콘텐츠 확장에 어려움 발생"

      - type: text
        inner:
          ko: "<i>개선 사항</i>"
      - type: list
        inner:
          - ko: "분산된 예외 처리 로직을 공통 모듈로 통합하여 일관된 데이터 처리 흐름 구축"
          - ko: "재사용 가능한 공통 모듈을 통해 신규 콘텐츠 확장성 확보"

  - period: "2021.12 - 2023.01"
    company: "J&FIRST"
    job_title:
      ko: "프론트엔드 개발자"
    specs:
      - react
      - nextjs
      - typescript
      - graphql
      - spring
      - mysql
      - nginx
      - java
    affiliation:
      ko: "개발팀"
    resume_description:
      - type: paragraph
        inner:
          ko: "LINE Plus의 외주 프로젝트에서 프론트엔드 개발을 담당했습니다."
      - type: heading
        inner:
          ko: "What I did"
      - type: list
        inner:
          - ko: "React Hook Form 기반의 deeply nested form 구현"
          - ko: "팀 내 공통 소스코드 관리 및 개선"
          - ko: "캐싱 정책을 통한 페이지 로딩 시간 개선 (2400ms → 1300ms)"
          - ko: "Next.js, GraphQL 등 신규 기술 도입을 위한 선행 연구"
          - ko: "팀 내 또는 외부 개발팀과의 소스코드 충돌 해결"
          - ko: "Java Spring 기반의 백엔드 보조 업무 수행"
    description:
      - type: paragraph
        inner:
          ko: "LINE Plus의 관리자용 웹 서비스 외주 프로젝트에 프론트엔드 개발자로 참여했습니다."

      - type: heading
        inner:
          ko: "What I did"
      - type: list
        inner:
          - ko: "React Hook Form 기반의 deeply nested form 구현"
          - ko: "팀 내 공통 소스코드 관리 및 개선"
          - ko: "캐싱 정책을 통한 페이지 로딩 시간 개선 (2400ms → 1300ms)"
          - ko: "Next.js, GraphQL, Naver SmartEditor ONE (네이버 블로그 작성 시 사용되는 에디터) 등 신규 기술 도입을 위한 선행 연구"
          - ko: "팀 내 또는 외부 개발팀과의 소스코드 충돌 해결"
          - ko: "Java Spring 기반의 백엔드 보조 업무 수행"

      - type: heading
        inner:
          ko: "문제 해결 사례: 웹 페이지 로딩 시간 개선"

      - type: paragraph
        inner:
          ko: "타사에서 진행한 유사 LINE Plus 외주 프로젝트 대비 페이지 로딩이 느리다는 피드백이 있었고, 원인을 분석하여 개선한 사례입니다."

      - type: text
        inner:
          ko: "<i>원인 분석: 비활성화된 브라우저 캐싱</i>"
      - type: list
        inner:
          - ko: "Inspect Tool을 활용하여 CPU 사용량 분포 분석: 대부분 유휴 상태임을 확인"
          - ko: "<code>css</code>와 <code>js</code> 정적 리소스 다운로드에 상당 시간 소요"
          - ko: "브라우저 캐싱을 전혀 사용하지 않아 매번 정적 리소스를 새로 다운로드하는 구조"
          - ko: "소스코드 변경 사항 즉시 반영을 위해 <code>no-cache</code> 정책을 사용했던 것이 원인"

      - type: text
        inner:
          ko: "<i>개선 사항: 소스코드 변경 사항 즉시 반영과 캐싱을 동시에 활용</i>"
      - type: list
        inner:
          - ko: "Bundler 설정에서 정적 리소스 파일명에 hash를 적용하여 Cache Busting을 구현"
          - ko: "캐싱 정책은 기존으로 복구"
          - ko: "페이지 로딩 시간 약 45% 개선 (2400ms → 1300ms)"
