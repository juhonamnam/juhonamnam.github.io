services:
  jekyll:
    build: .
    ports:
      - "4000:4000"
      - "35729:35729"
    volumes:
      - .:/usr/src/app
      - bundle_cache:/usr/local/bundle
    environment:
      - BUNDLE_PATH=/usr/local/bundle
    command: bundle exec jekyll serve --host 0.0.0.0 --port 4000 --livereload --force-polling

volumes:
  bundle_cache:
